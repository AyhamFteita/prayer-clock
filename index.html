// ES5 prayer-time calculation (PrayTimes.org method). Returns absolute ms timestamps.
function calcPrayerTimes(y, m, d, lat, lng, fajrAngle, ishaAngle, asrFactor) {
  var DR = Math.PI / 180;

  function fix(a, b) { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; }

  if (mm <= 2) { yy -= 1; mm += 12; }
  var A = Math.floor(yy / 100), B = 2 - A + Math.floor(A / 4);
  var jd = Math.floor(365.25 * (yy + 4716)) + Math.floor(30.6001 * (mm + 1)) + d + B - 1524.5;
  var jDate = jd - lng / (15 * 24);

  function sunPos(j) {
    var D = j - 2451545.0;
    var g = fix(357.529 + 0.98560028 * D, 360);
    var q = fix(280.459 + 0.98564736 * D, 360);
    var L = fix(q + 1.915 * sin(g) + 0.020 * sin(2 * g), 360);
    var e = 23.439 - 0.00000036 * D;
    var RA = atan2(cos(e) * sin(L), cos(L)) / 15;
    return { eqt: q / 15 - fix(RA, 24), decl: asin(sin(e) * sin(L)) };
  }
  function midDay(t) { return fix(12 - sunPos(jDate + t).eqt, 24); }
  function angleTime(angle, t, ccw) {
    var decl = sunPos(jDate + t).decl, noon = midDay(t);
    var v = acos((-sin(angle) - sin(decl) * sin(lat)) / (cos(decl) * cos(lat))) / 15;
    return noon + (ccw ? -v : v);
  }
  function asrTime(factor, t) {
    var decl = sunPos(jDate + t).decl;
    return angleTime(-acot(factor + tan(Math.abs(lat - decl))), t);
  }

  var t = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, maghrib: 18, isha: 18 };
  for (var i = 0; i < 2; i++) {
    t = {
      fajr: angleTime(fajrAngle, t.fajr / 24, true),
      sunrise: angleTime(0.833, t.sunrise / 24, true),
      dhuhr: midDay(t.dhuhr / 24),
      asr: asrTime(asrFactor, t.asr / 24),
      maghrib: angleTime(0.833, t.maghrib / 24),
      isha: angleTime(ishaAngle, t.isha / 24)
    };
  }
  var base = Date.UTC(y, m - 1, d), out = {};
  for (var k in t) {
    var ms = base + (t[k] - lng / 15) * 3600000;
    out[k] = Math.round(ms / 60000) * 60000;  // nearest minute
  }
  return out;
}

  var H_EN = ["Muharram", "Safar", "Rabi' al-Awwal", "Rabi' al-Thani", "Jumada al-Ula", "Jumada al-Akhirah",
              "Rajab", "Sha'ban", "Ramadan", "Shawwal", "Dhu al-Qi'dah", "Dhu al-Hijjah"];
  var H_AR = ["محرم", "صفر", "ربيع الأول", "ربيع الآخر", "جمادى الأولى", "جمادى الآخرة",
              "رجب", "شعبان", "رمضان", "شوال", "ذو القعدة", "ذو الحجة"];
  var NAMES = [["fajr", "Fajr", "الفجر"], ["sunrise", "Sunrise", "الشروق"], ["dhuhr", "Dhuhr", "الظهر"],
               ["asr", "Asr", "العصر"], ["maghrib", "Maghrib", "المغرب"], ["isha", "Isha", "العشاء"]];

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function fmtTime(ms) {
    var d = new Date(ms), h = d.getHours(), m = d.getMinutes();
    if (SETTINGS.clock24h) return pad(h) + ":" + pad(m);
    return (h % 12 || 12) + ":" + pad(m) + " " + (h >= 12 ? "PM" : "AM");
  }
  function dayKey(d) { return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
  function dayIndex(y, m, d) { return Math.floor(Date.UTC(y, m - 1, d) / 86400000); }

  // ---------------------------------------------------------------- prayer schedule
  var TODAY = null, PRAYERS = [], TOMORROW_FAJR = null, YESTERDAY_ISHA = null, HIJRI = null;

  function prayersFor(date) {
    var S = SETTINGS;
    var t = calcPrayerTimes(date.getFullYear(), date.getMonth() + 1, date.getDate(),
                            S.latitude, S.longitude, S.fajrAngle, S.ishaAngle, S.asrFactor);
    var list = [];
    for (var i = 0; i < NAMES.length; i++) {
      var k = NAMES[i][0], en = NAMES[i][1], ar = NAMES[i][2];
      if (k === "dhuhr" && date.getDay() === 5) { en = "Jumu'ah"; ar = "الجمعة"; }
      list.push({ key: k, name: en, arabic: ar, ts: t[k] + (S.adjust[k] || 0) * 60000 });
    }
    return list;
  }

  function hijriFor(date) {
    var target = dayIndex(date.getFullYear(), date.getMonth() + 1, date.getDate()) + SETTINGS.hijriAdjustDays;
    for (var i = HIJRI_TABLE.length - 1; i >= 0; i--) {
      var r = HIJRI_TABLE[i], start = dayIndex(r[2], r[3], r[4]);
      if (start <= target) {
        if (i === HIJRI_TABLE.length - 1 && target - start > 30) return null;
        var day = target - start + 1;
        return { en: day + " " + H_EN[r[1] - 1] + " " + r[0] + " AH", ar: day + " " + H_AR[r[1] - 1] + " " + r[0] + " هـ" };
      }
    }
    return null;
  }

  function newDay(now) {
    TODAY = dayKey(now);
    PRAYERS = prayersFor(now);
    var tm = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 12);
    TOMORROW_FAJR = prayersFor(tm)[0];
    var yd = prayersFor(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1, 12));
    YESTERDAY_ISHA = yd[yd.length - 1];
    HIJRI = hijriFor(now);
    $("hijri").innerHTML = HIJRI ? esc(HIJRI.en) + '<span class="ar">' + esc(HIJRI.ar) + "</span>" : "&nbsp;";
    shownNext = null;
  }

  function nextPrayer(ms) {
    for (var i = 0; i < PRAYERS.length; i++) if (PRAYERS[i].key !== "sunrise" && PRAYERS[i].ts > ms) return PRAYERS[i];
    return TOMORROW_FAJR;
  }

  function prevPrayer(ms) {
    var last = YESTERDAY_ISHA;
    for (var i = 0; i < PRAYERS.length; i++) if (PRAYERS[i].key !== "sunrise" && PRAYERS[i].ts <= ms) last = PRAYERS[i];
    return last;
  }

  var shownNext = null;
  function renderPrayers(ms) {
    var nxt = nextPrayer(ms), html = "";
    for (var i = 0; i < PRAYERS.length; i++) {
      var p = PRAYERS[i], cls = "p " + p.key;
      if (p.key === "fajr" && nxt === TOMORROW_FAJR) p = TOMORROW_FAJR;
      if (p === nxt) cls += " next-p"; else if (p.ts <= ms) cls += " passed";
      html += '<div class="' + cls + '"><div class="en">' + esc(p.name) + '</div><div class="ar">' + esc(p.arabic) +
              '</div><div class="t">' + fmtTime(p.ts) + "</div></div>";
    }
    $("prayers").innerHTML = html;
    $("cdName").innerHTML = esc(nxt === TOMORROW_FAJR ? "Fajr" : nxt.name) + '<span class="ar">' + esc(nxt.arabic) + "</span>";
    $("cdAt").innerHTML = (nxt === TOMORROW_FAJR ? "Tomorrow at " : "at ") + fmtTime(nxt.ts);
    var pv = prevPrayer(ms);
    $("pvName").innerHTML = esc(pv.name) + '<span class="ar">' + esc(pv.arabic) + "</span>";
    $("pvAt").innerHTML = "ago · " + (pv === YESTERDAY_ISHA ? "yesterday at " : "at ") + fmtTime(pv.ts);
  }

  function hms(s) {
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return (h ? h + ":" + pad(m) : m) + ":" + pad(sec);
  }
  function renderCountdown(ms) {
    $("cdIn").innerHTML = hms(Math.max(0, Math.floor((nextPrayer(ms).ts - ms) / 1000)));
    $("pvAgo").innerHTML = hms(Math.max(0, Math.floor((ms - prevPrayer(ms).ts) / 1000)));
  }

  // ---------------------------------------------------------------- clock loop
  var lastTick = new Date().getTime();
  function tick() {
    var now = new Date(), ms = now.getTime();
    if (dayKey(now) !== TODAY) newDay(now);

    var h = now.getHours(), html;
    if (SETTINGS.clock24h) html = pad(h) + ":" + pad(now.getMinutes());
    else html = (h % 12 || 12) + ":" + pad(now.getMinutes()) + '<span class="ampm">' + (h >= 12 ? "PM" : "AM") + "</span>";
    $("clock").innerHTML = html;
    $("date").innerHTML = DAYS[now.getDay()] + ", " + MONTHS[now.getMonth()] + " " + now.getDate() + ", " + now.getFullYear();

    var nxt = nextPrayer(ms), key = nxt.key + nxt.ts;
    if (key !== shownNext) { shownNext = key; renderPrayers(ms); }
    renderCountdown(ms);

    // Adhan fires only when the clock crosses a prayer time (never on page load).
    for (var i = 0; i < PRAYERS.length; i++) {
      var p = PRAYERS[i];
      if (p.key === "sunrise") continue;
      if (p.ts - 120000 > lastTick && p.ts - 120000 <= ms) preloadAdhan(p.key);
      if (p.ts > lastTick && p.ts <= ms && ms - p.ts < 120000) playAdhan(p.key, p.name + " adhan playing");
    }
    if (TOMORROW_FAJR.ts - 120000 > lastTick && TOMORROW_FAJR.ts - 120000 <= ms) preloadAdhan("fajr");
    lastTick = ms;
    renderDim(now);
    renderStatus();
  }

  // ---------------------------------------------------------------- night dim
  function toMin(s) { var p = s.split(":"); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }
  function renderDim(now) {
    var nd = SETTINGS.nightDim, on = false;
    if (nd) {
      var cur = now.getHours() * 60 + now.getMinutes(), s = toMin(nd.start), e = toMin(nd.end);
      on = s > e ? (cur >= s || cur < e) : (cur >= s && cur < e);
    }
    $("dim").style.opacity = on && !playing ? "0.55" : "0";
  }

  // ---------------------------------------------------------------- adhan audio
  // Old iPads often can't stream audio through Safari's media player, so the adhan is
  // downloaded like any other page data (XMLHttpRequest) and played through Web Audio.
  // The <audio> element is only a fallback for browsers without Web Audio.
  var player = $("player"), unlocked = false, playing = false, rotation = 0;
  var AC = window.AudioContext || window.webkitAudioContext, ctx = null, source = null;
  var cache = { file: null, buffer: null, loading: null, waiters: [] };

  function adhanFile(key) {
    var f = SETTINGS.adhan[key];
    if (f && f.push) return f[(Math.floor(new Date().getTime() / 86400000) + rotation) % f.length];
    return f;
  }

  // Newer browsers return a promise from play()/decodeAudioData(); iOS 9 doesn't. Ignore either way.
  function quiet(r) { if (r && r["catch"]) r["catch"](function () {}); }
  function startNode(n) { if (n.start) n.start(0); else n.noteOn(0); }
  function stopNode(n) { try { if (n.stop) n.stop(0); else n.noteOff(0); } catch (e) {} }

  // Download + decode one file; keeps only one decoded adhan in memory at a time.
  function loadBuffer(file, done) {
    if (cache.file === file && cache.buffer) return done(cache.buffer);
    cache.waiters.push(done);
    if (cache.loading === file) return;
    cache.file = file; cache.buffer = null; cache.loading = file;
    var x = new XMLHttpRequest();
    x.open("GET", file, true);
    x.responseType = "arraybuffer";
    x.timeout = 60000;
    function finish(buf) {
      cache.loading = null;
      if (buf) cache.buffer = buf; else cache.file = null;
      var w = cache.waiters; cache.waiters = [];
      for (var i = 0; i < w.length; i++) w[i](buf);
    }
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status !== 200 || !x.response) { setStatusNote("adhan download failed"); return finish(null); }
      try {
        quiet(ctx.decodeAudioData(x.response, function (buf) { finish(buf); },
                                  function () { setStatusNote("adhan file can't be decoded"); finish(null); }));
      } catch (e) { setStatusNote("adhan decode error"); finish(null); }
    };
    x.ontimeout = function () { setStatusNote("adhan download timed out"); finish(null); };
    x.send();
  }

  // Called a couple of minutes early so the file is ready the second the prayer comes in.
  function preloadAdhan(key) { if (ctx && unlocked) loadBuffer(adhanFile(key), function () {}); }

  function showPlaying(on, label) {
    playing = on;
    $("playing").innerHTML = (label || "Adhan playing") + " — tap anywhere to stop";
    $("playing").style.display = on ? "block" : "none";
  }

  function playAdhan(key, label) {
    var f = adhanFile(key);
    if (!f || !unlocked) return;
    stopAdhan();
    showPlaying(true, label);
    if (ctx) {
      if (ctx.resume && ctx.state && ctx.state !== "running") quiet(ctx.resume());
      var started = new Date().getTime();
      loadBuffer(f, function (buf) {
        if (!playing) return;                                   // stopped while loading
        if (!buf || new Date().getTime() - started > 180000) return showPlaying(false);
        source = ctx.createBufferSource();
        source.buffer = buf;
        source.connect(ctx.destination);
        source.onended = function () { if (this === source) { source = null; showPlaying(false); } };
        startNode(source);
      });
      return;
    }
    try { player.src = f; player.load(); quiet(player.play()); } catch (e) { showPlaying(false); }
  }

  function stopAdhan() {
    if (source) { var s = source; source = null; stopNode(s); }
    try { player.pause(); } catch (e) {}
    showPlaying(false);
  }
  player.addEventListener("ended", function () { showPlaying(false); });
  player.addEventListener("error", function () { setStatusNote("adhan file can't play"); showPlaying(false); });

  // iOS only allows sound after a tap. The first tap creates the audio engine and plays
  // a tiny silent sound, which keeps sound allowed for as long as the page stays open.
  function unlockAudio() {
    if (AC) {
      try {
        if (!ctx) ctx = new AC();
        var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource();
        s.buffer = b; s.connect(ctx.destination); startNode(s);
        if (ctx.resume) quiet(ctx.resume());
      } catch (e) { ctx = null; }
    }
    if (!ctx) {
      try { player.src = adhanFile("fajr"); player.load(); quiet(player.play()); player.pause(); } catch (e) {}
    }
    unlocked = true;
    $("unlock").style.display = "none";
  }

  function onTap(e) {
    if (!unlocked) { unlockAudio(); if (e && e.preventDefault) e.preventDefault(); return; }
    if (ctx && ctx.resume && ctx.state && ctx.state !== "running") quiet(ctx.resume());  // re-arm if iOS paused it
    if (playing) stopAdhan();
  }
  document.addEventListener("touchend", onTap, false);
  document.addEventListener("click", function (e) { if (!("ontouchend" in document)) onTap(e); }, false);

  // Test button: plays the adhan for the next prayer right now.
  function onTest(e) {
    if (e.stopPropagation) e.stopPropagation();
    if (e.preventDefault) e.preventDefault();
    if (!unlocked) unlockAudio();
    if (playing) return stopAdhan();
    playAdhan(nextPrayer(new Date().getTime()).key, "Test adhan playing");
  }
  $("test").addEventListener("touchend", onTest, false);
  $("test").addEventListener("click", function (e) { if (!("ontouchend" in document)) onTest(e); }, false);

  var NOTE = "", NOTE_AT = 0;
  function setStatusNote(s) { NOTE = s; NOTE_AT = new Date().getTime(); }

  // ---------------------------------------------------------------- weather
  var WEATHER_OK = 0, WEATHER_TRY = 0, WEATHER_AGE = 0;
  var CODES = { 0: ["Clear", "☀️"], 1: ["Mostly clear", "🌤"], 2: ["Partly cloudy", "⛅️"], 3: ["Cloudy", "☁️"],
    45: ["Fog", "🌫"], 48: ["Fog", "🌫"], 51: ["Light drizzle", "🌦"], 53: ["Drizzle", "🌦"], 55: ["Drizzle", "🌧"],
    56: ["Freezing drizzle", "🌧"], 57: ["Freezing drizzle", "🌧"], 61: ["Light rain", "🌦"], 63: ["Rain", "🌧"],
    65: ["Heavy rain", "🌧"], 66: ["Freezing rain", "🌧"], 67: ["Freezing rain", "🌧"], 71: ["Light snow", "🌨"],
    73: ["Snow", "🌨"], 75: ["Heavy snow", "❄️"], 77: ["Snow", "🌨"], 80: ["Showers", "🌦"], 81: ["Showers", "🌧"],
    82: ["Heavy showers", "🌧"], 85: ["Snow showers", "🌨"], 86: ["Snow showers", "🌨"],
    95: ["Thunderstorm", "⛈"], 96: ["Thunderstorm", "⛈"], 99: ["Thunderstorm", "⛈"] };

  function getJSON(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.timeout = 20000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status === 200) { try { ok(JSON.parse(x.responseText)); return; } catch (e) {} }
      fail();
    };
    x.ontimeout = function () { fail(); };
    x.send();
  }

  function showWeather(w) {
    WEATHER_OK = new Date().getTime();
    $("weather").innerHTML = '<div class="now"><span class="icon">' + w.icon + "</span>" + w.temp + "°</div>" +
      '<div class="desc">' + esc(w.text) + "</div>" +
      (w.meta ? '<div class="meta muted">' + esc(w.meta) + "</div>" : "") +
      '<div class="loc muted">' + esc(SETTINGS.locationName) + "</div>";
    var html = "";
    for (var i = 0; i < w.daily.length; i++) {
      var d = w.daily[i];
      html += '<div class="day"><div class="lbl">' + esc(d.label) + '</div><div class="ic">' + d.icon + "</div>" +
              '<div class="rain">' + (d.rain != null ? d.rain + "%" : "") + "</div>" +
              '<div class="hl">' + d.hi + "°" + (d.lo != null ? '<span class="lo">' + d.lo + "°</span>" : "") + "</div></div>";
    }
    $("forecast").innerHTML = html;
  }

  // Weather comes from weather.json on this same site. A GitHub Action refreshes it every
  // 30 minutes, so the iPad never has to connect to a weather service itself (iOS 9 can't).
  function refreshWeather() {
    WEATHER_TRY = new Date().getTime();
    getJSON("weather.json?_=" + WEATHER_TRY, function (d) {
      if (!d || !d.current || !d.daily) return;
      var S = SETTINGS, c = d.current, k = CODES[c.weather_code] || ["—", "🌡"], daily = [];
      var today = new Date(), todayKey = today.getFullYear() + "-" + pad(today.getMonth() + 1) + "-" + pad(today.getDate());
      for (var i = 0; i < d.daily.time.length && daily.length < 4; i++) {
        if (d.daily.time[i] < todayKey) continue;   // skip days already past if the file is a bit old
        var p = d.daily.time[i].split("-"), dt = new Date(+p[0], +p[1] - 1, +p[2]);
        var dk = CODES[d.daily.weather_code[i]] || ["", "🌡"];
        daily.push({ label: d.daily.time[i] === todayKey ? "Today" : DAYS[dt.getDay()].substr(0, 3), icon: dk[1],
                     hi: Math.round(d.daily.temperature_2m_max[i]), lo: Math.round(d.daily.temperature_2m_min[i]),
                     rain: d.daily.precipitation_probability_max[i] });
      }
      showWeather({ temp: Math.round(c.temperature_2m), text: k[0], icon: k[1], daily: daily,
        meta: "Feels " + Math.round(c.apparent_temperature) + "° · " + c.relative_humidity_2m + "% · " +
              Math.round(c.wind_speed_10m) + (S.fahrenheit ? " mph" : " km/h") });
      WEATHER_AGE = d.fetched_at ? new Date().getTime() - d.fetched_at * 1000 : 0;
    }, function () {});
  }

  // ---------------------------------------------------------------- status
  function renderStatus() {
    var el = $("status"), age = new Date().getTime() - WEATHER_OK;
    var sound = unlocked ? "🔊 Adhan on" : "🔇 Adhan off — tap screen";
    if (NOTE && new Date().getTime() - NOTE_AT < 600000) sound += " · " + esc(NOTE);
    if (WEATHER_OK && (age > 90 * 60000 || WEATHER_AGE > 3 * 3600000)) { el.className = "status bad"; el.innerHTML = sound + " · weather not updating"; }
    else if (!WEATHER_OK && new Date().getTime() - WEATHER_TRY > 60000) { el.className = "status bad"; el.innerHTML = sound + " · weather unavailable"; }
    else { el.className = unlocked ? "status" : "status bad"; el.innerHTML = sound; }
  }

  newDay(new Date());
  tick();
  setInterval(tick, 1000);
  refreshWeather();
  setInterval(refreshWeather, 15 * 60000);
})();
</script>
</body>
</html>
