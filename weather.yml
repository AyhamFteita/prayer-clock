# Publishes the site and refreshes weather.json every 30 minutes.
# The iPad 2 can't connect to weather services itself, so GitHub fetches the
# weather and serves it from the same site the iPad already loads.
name: Publish site + weather

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # weather refresh (GitHub may run it a few minutes late)
    - cron: "0 6 1 * *"      # monthly keep-alive so GitHub doesn't pause the schedule
  workflow_dispatch:

env:
  LAT: "29.675"
  LON: "-95.705"
  UNIT: "fahrenheit"         # or celsius
  WIND: "mph"                # or kmh

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.schedule != '0 6 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch weather
        run: |
          URL="https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=${UNIT}&wind_speed_unit=${WIND}&timezone=auto&forecast_days=5"
          SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          if curl -fsS --retry 3 --max-time 30 "$URL" -o raw.json; then
            jq --argjson t "$(date +%s)" '. + {fetched_at: $t}' raw.json > weather.json
          else
            echo "Open-Meteo failed; keeping the last published weather"
            curl -fsS --max-time 30 "$SITE/weather.json" -o weather.json || echo '{}' > weather.json
          fi
          rm -f raw.json
          head -c 300 weather.json; echo

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    if: github.event.schedule == '0 6 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit --allow-empty -m "keep-alive"
          git push
